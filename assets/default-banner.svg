<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">sealad886 .github Templates</title>
  <desc id="desc">A dark blue banner for the sealad886 default GitHub community-health repository, highlighting consistent, accelerated, reliable, and scalable repository templates.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.58" stop-color="#06152f"/>
      <stop offset="1" stop-color="#082552"/>
    </linearGradient>
    <radialGradient id="rightGlow" cx="74%" cy="40%" r="48%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#1d4ed8" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67b6ff"/>
      <stop offset="0.55" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#315efb"/>
    </linearGradient>
    <linearGradient id="folderStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ac7ff"/>
      <stop offset="0.52" stop-color="#5c95ff"/>
      <stop offset="1" stop-color="#3366ff"/>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#377dff" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#6eb6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2f62ff" stop-opacity="0.55"/>
