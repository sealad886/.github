name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
        if: hashFiles('**/package.json') != ''

      - name: Install dependencies
        run: npm ci
        if: hashFiles('**/package.json') != ''

      - name: Run linter
        run: npm run lint --if-present
        if: hashFiles('**/package.json') != ''

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
        if: hashFiles('**/package.json') != ''

      - name: Install dependencies
        run: npm ci
        if: hashFiles('**/package.json') != ''

      - name: Run tests
        run: npm test --if-present
        if: hashFiles('**/package.json') != ''

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
        if: hashFiles('**/package.json') != ''

      - name: Install dependencies
        run: npm ci
        if: hashFiles('**/package.json') != ''

      - name: Build project
        run: npm run build --if-present
        if: hashFiles('**/package.json') != ''
